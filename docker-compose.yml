version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: my_lover_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-changeme123}
      POSTGRES_DB: ${DB_NAME:-my_lover}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "${DB_PORT:-5432}:5432"
    networks:
      - my_lover_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-my_lover}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Next.js Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: my_lover_app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      # Database connection
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-changeme123}@postgres:5432/${DB_NAME:-my_lover}

      # Node environment
      NODE_ENV: production

      # Next.js configuration
      NEXT_TELEMETRY_DISABLED: 1

      # Application URL (for absolute URLs if needed)
      NEXT_PUBLIC_APP_URL: ${APP_URL:-http://localhost:3000}
    volumes:
      # Persist uploaded images
      - ./public/uploads:/app/public/uploads

      # Logs (optional)
      - ./logs:/app/logs
    ports:
      - "${APP_PORT:-3000}:3000"
    networks:
      - my_lover_network
    healthcheck:
      test: ["CMD", "node", "-e", "require('http').get('http://localhost:3000/api/health', (r) => {process.exit(r.statusCode === 200 ? 0 : 1)})"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

# Named volumes for data persistence
volumes:
  postgres_data:
    driver: local
    name: my_lover_postgres_data

# Network for inter-container communication
networks:
  my_lover_network:
    driver: bridge
    name: my_lover_network
